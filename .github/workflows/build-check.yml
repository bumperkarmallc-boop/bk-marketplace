# Build check for recovery work branches.
# Runs on GitHub's servers when a recovery/* branch is pushed.
# It never deploys, never touches main, and uses NO real secrets:
# the Supabase values below are harmless placeholders so the build can run.
name: Build check

on:
  push:
    branches:
      - "recovery/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Each check publishes its complete output as ONE note, because GitHub
      # only shows 10 separate error notes per step on public pages.
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            echo "::error title=TYPECHECK FULL OUTPUT::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' typecheck.log | head -c 60000)"
          fi
          exit $status
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npx eslint . --format unix 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            echo "::error title=LINT FULL OUTPUT::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' lint.log | head -c 60000)"
          fi
          exit $status
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            echo "::error title=BUILD FULL OUTPUT::$(tail -n 80 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | head -c 60000)"
          fi
          exit $status
      - name: Summary
        run: |
          echo "Type check: ${{ steps.typecheck.outcome }}"
          echo "Lint:       ${{ steps.lint.outcome }}"
          echo "Build:      ${{ steps.build.outcome }}"
          {
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Type check | ${{ steps.typecheck.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi
